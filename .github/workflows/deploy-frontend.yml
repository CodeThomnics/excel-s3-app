name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  # Configure these as repository or environment variables in GitHub.
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  VITE_API_URL: ${{ vars.VITE_API_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate deployment configuration
        run: |
          test -n "${AWS_REGION}" || { echo "Missing AWS_REGION GitHub variable"; exit 1; }
          test -n "${S3_BUCKET}" || { echo "Missing FRONTEND_S3_BUCKET GitHub variable"; exit 1; }
          test -n "${VITE_API_URL}" || { echo "Missing VITE_API_URL GitHub variable"; exit 1; }
          test -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" || { echo "Missing AWS_DEPLOY_ROLE_ARN GitHub secret"; exit 1; }

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Sync static assets to S3
        run: |
          aws s3 sync frontend/dist "s3://${S3_BUCKET}" \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML entry points
        run: |
          aws s3 cp frontend/dist "s3://${S3_BUCKET}" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"